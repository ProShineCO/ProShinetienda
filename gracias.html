<style>
  :root{
    --bg:#08090b;
    --bg-soft:#0f1114;
    --panel:#131519;
    --line:rgba(245,246,248,0.10);
    --ink:#f4f5f7;
    --muted:#9aa0ab;
    --blue-soft:#7c8bff;
    --green:#7be62f;
    --red:#e5273a;
    --red-deep:#4a0a12;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .display{font-family:'Fraunces',serif;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--muted);
  }

  header{
    padding:26px 32px;display:flex;justify-content:center;
  }
  .logo img{height:24px;width:auto;}

  main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:40px 24px 80px;position:relative;overflow:hidden;
  }
  main::before{
    content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
    width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle, rgba(123,230,47,0.10), transparent 65%);
    pointer-events:none;
  }
  .card{
    position:relative;z-index:1;
    max-width:560px;width:100%;text-align:center;
  }
  .check{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg, var(--green), #4bb51a);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 12px 30px rgba(123,230,47,0.25);
  }
  .check svg{width:30px;height:30px;}

  h1{
    font-size:clamp(30px,5vw,44px);font-weight:500;line-height:1.15;
    margin-bottom:16px;
  }
  h1 em{font-style:italic;color:var(--green);}

  .card > p.sub{
    color:var(--muted);font-size:15.5px;line-height:1.7;font-weight:300;
    max-width:440px;margin:0 auto 40px;
  }

  .kit-thumb{
    width:72px;height:72px;border-radius:12px;overflow:hidden;
    margin:0 auto 28px;border:1px solid var(--line);
    background:#000;
  }
  .kit-thumb img{width:100%;height:100%;object-fit:cover;}

  .actions{
    display:flex;flex-direction:column;gap:14px;
    max-width:340px;margin:0 auto;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 28px;border-radius:100px;
    font-size:13px;letter-spacing:0.05em;font-weight:600;
    text-transform:uppercase;font-family:'Inter',sans-serif;
    transition:transform .3s ease, box-shadow .3s ease, background .3s ease;
    border:1px solid transparent;cursor:pointer;
  }
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 30px rgba(229,39,58,0.25);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(229,39,58,0.4);}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:transparent;}
  .btn-ghost:hover{border-color:#7c8bff;background:rgba(124,139,255,0.08);}

  .divider-note{
    margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.6;
  }

  .back-link{
    display:inline-block;margin-top:26px;font-size:12px;color:var(--muted);
    font-family:'Space Mono',monospace;letter-spacing:.04em;
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .back-link:hover{color:var(--ink);border-color:var(--ink);}

  footer{
    padding:26px 32px;text-align:center;
    font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);
    border-top:1px solid var(--line);
  }

  @media (max-width:480px){
    .actions{max-width:100%;}
  }
</style>
</head>
